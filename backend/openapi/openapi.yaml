# LAMINE backend — authoritative REST contract.
#
# Hand-written on purpose: this file is the source of truth for the DTOs in
# internal/model/ and for the Go types generated into internal/api/ by
# oapi-codegen. Field names and json tags mirror plan.md §8.4 (DDL) exactly.
#
# Regenerate Go types with:  make gen  (see openapi/README.md)
openapi: 3.1.0
info:
  title: LAMINE API
  version: 1.0.0
  summary: Goals, matches, stats and heatmaps of Lamine Yamal.
  description: |
    JSON in / JSON out. All mutating operations (POST/PUT/PATCH/DELETE) require
    the `X-Admin-Token` header. Errors are RFC 9457 `application/problem+json`.
    Coordinates (`location_x`, `location_y`) are always pitch metres on a
    105x68 m pitch, origin top-left, attacking left-to-right.
  license:
    name: MIT
  contact:
    name: LAMINE
servers:
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: health
  - name: meta
  - name: players
  - name: teams
  - name: competitions
  - name: opponents
  - name: matches
  - name: goals
  - name: stats
  - name: viz

# ---------------------------------------------------------------------------
# Security scheme
# ---------------------------------------------------------------------------
security: []

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe + database ping
      tags: [health]
      security: []
      responses:
        "200":
          description: Service is up and the database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /openapi.json:
    get:
      operationId: openapiJson
      summary: This document, served verbatim
      tags: [meta]
      security: []
      responses:
        "200":
          description: The embedded OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          $ref: "#/components/responses/InternalError"

