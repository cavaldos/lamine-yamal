  # -------------------------------------------------------------------------
  # Match stats
  # -------------------------------------------------------------------------
  /api/v1/matches/{id}/stats:
    get:
      operationId: getMatchStats
      summary: Per-match stats (plus heatmap when present)
      tags: [stats]
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The match stat row. `heatmap` is null when we hold no
            tracking data — the UI must render an empty state, not zeros.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchStat"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: upsertMatchStats
      summary: Create or replace the stat row of a match (idempotent)
      tags: [stats]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AdminToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchStat"
